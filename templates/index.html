<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP Job Recommendation</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --blue: #2563EB;
            --blue-dark: #1d4ed8;
            --blue-light: #3b82f6;
            --card-bg: rgba(255,255,255,0.97);
            --text: #1e293b;
            --muted: #64748b;
            --radius: 16px;
        }

        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: #0f172a;
        }

        /* ── BACKGROUND ── */
        .bg-scene {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                linear-gradient(135deg, rgba(15,23,42,0.92) 0%, rgba(30,58,138,0.85) 100%);
        }
        .bg-scene::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(ellipse 80% 60% at 70% 30%, rgba(37,99,235,0.25) 0%, transparent 70%),
                radial-gradient(ellipse 60% 50% at 20% 80%, rgba(99,102,241,0.18) 0%, transparent 70%);
        }
        /* floating grid dots */
        .bg-scene::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 36px 36px;
        }

        /* decorative blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            z-index: 0;
            animation: drift 12s ease-in-out infinite alternate;
        }
        .blob-1 { width: 520px; height: 520px; background: #3b82f6; top: -120px; right: -80px; animation-delay: 0s; }
        .blob-2 { width: 400px; height: 400px; background: #6366f1; bottom: -100px; left: -60px; animation-delay: -4s; }
        .blob-3 { width: 300px; height: 300px; background: #0ea5e9; top: 40%; left: 40%; animation-delay: -8s; }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(30px, -20px) scale(1.05); }
        }

        /* ── NAVBAR ── */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: var(--blue);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            height: 64px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.25);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
        }
        .nav-brand .logo-icon {
            width: 38px; height: 38px;
            background: rgba(255,255,255,0.18);
            border-radius: 10px;
            display: grid; place-items: center;
            font-size: 20px;
        }
        .nav-brand span {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-links a {
            color: rgba(255,255,255,0.88);
            text-decoration: none;
            font-size: 0.93rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .nav-links a:hover { background: rgba(255,255,255,0.15); color: white; }

        /* ── MAIN CONTENT ── */
        main {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 1.5rem 3rem;
        }

        .content-wrapper {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeUp 0.7s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* hero card */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 2rem 2.2rem;
            box-shadow: 0 8px 40px rgba(0,0,0,0.22), 0 1px 0 rgba(255,255,255,0.8) inset;
        }

        .hero-card h1 {
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .hero-card p {
            color: var(--muted);
            font-size: 0.97rem;
        }

        /* input card */
        .input-card label {
            display: block;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 10px;
        }

        .input-card textarea {
            width: 100%;
            height: 160px;
            padding: 14px 16px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.97rem;
            color: var(--text);
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            resize: vertical;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            line-height: 1.6;
        }
        .input-card textarea::placeholder { color: #94a3b8; }
        .input-card textarea:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
            background: #fff;
        }

        .btn-search {
            margin-top: 14px;
            width: 100%;
            padding: 13px;
            background: var(--blue);
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            letter-spacing: 0.2px;
        }
        .btn-search:hover {
            background: var(--blue-dark);
            box-shadow: 0 4px 16px rgba(37,99,235,0.35);
        }
        .btn-search:active { transform: scale(0.98); }

        .btn-search svg { width: 18px; height: 18px; }

        .hint {
            text-align: center;
            color: rgba(255,255,255,0.55);
            font-size: 0.83rem;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="bg-scene"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- NAVBAR -->
    <nav>
        <a class="nav-brand" href="/">
            <div class="logo-icon">💼</div>
            <span>JobMatch AI</span>
        </a>
        <div class="nav-links">
            <a href="/">🏠 Home</a>
        </div>
    </nav>

    <!-- MAIN -->
    <main>
        <div class="content-wrapper">

            <!-- Hero -->
            <div class="card hero-card">
                <h1>Job Recommendation</h1>
                <p>Describe your background, skills, and experience — our AI will extract what matters and find your best-fit jobs.</p>
            </div>

            <!-- Input Form -->
            <div class="card input-card">
                <label for="text">Your Skills & Background</label>
                <form method="POST">
                    <textarea
                        id="text"
                        name="text"
                        placeholder="e.g. I am a Python developer with 2 years of experience in machine learning, NLP, and data analysis. Familiar with TensorFlow, Scikit-learn, and Flask..."
                    ></textarea>
                    <button type="submit" class="btn-search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                        </svg>
                        Find Matching Jobs
                    </button>
                </form>
            </div>

            

        </div>
    </main>

</body>
</html>
